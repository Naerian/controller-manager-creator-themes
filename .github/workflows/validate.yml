name: Validate creator themes
on:
  pull_request:
    paths:
      - 'themes/**'
      - 'template/**'
      - 'tools/**'
      - 'schemas/**'
      - '.github/workflows/**'
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tools/validate-themes.ps1
